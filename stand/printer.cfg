# Stub printer config for the x402 hackathon stand.
# Board: Seeeduino Mega (ATmega2560, FTDI FT232 USB-TTL). GT2560 pin
# mapping used as a donor; stepper/endstop pins are NOT connected and
# their values don't matter.
#
# Real hardware on the board:
#   - WS2812B LED strip  -> PB5 (Arduino D11)
#   - Door servo (PPM)   -> PH3 (Arduino D6)
#
# Firmware build: make menuconfig -> AVR atmega2560, 16 MHz, then
#   make && make flash FLASH_DEVICE=/dev/serial/by-id/<your-board>

[mcu]
# Board has an FTDI FT232 USB-TTL converter -> enumerates as ttyUSB*
# (ftdi_sio). Prefer the stable by-id path: ls /dev/serial/by-id/
# (will look like usb-FTDI_FT232R_USB_UART_XXXXXXXX-if00-port0)
serial: /dev/ttyUSB0
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 20
max_z_accel: 500

# ------------------------------------------------------------------
# Dummy temperature sensor: maps the entire ADC range (0..5 V) to
# ~20 C, so a floating sensor pin always reads ≈20 C.
# ------------------------------------------------------------------
[adc_temperature dummy20]
temperature1: 19.9
voltage1: 0.0
temperature2: 20.1
voltage2: 5.0

# ------------------------------------------------------------------
# Steppers — pins are unconnected, values are placeholders from the
# GT2560 mapping. Homing is faked via the G28 override below.
# ------------------------------------------------------------------
[stepper_x]
step_pin: PA3
dir_pin: PA1
enable_pin: !PA5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA0
position_endstop: 0
position_max: 200
homing_speed: 30

[stepper_y]
step_pin: PC6
dir_pin: PC4
enable_pin: !PA7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA4
position_endstop: 0
position_max: 200
homing_speed: 30

[stepper_z]
step_pin: PC0
dir_pin: !PG2
enable_pin: !PC2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC7
position_endstop: 0
position_max: 200
position_min: 0.0

[extruder]
step_pin: PL6
dir_pin: PL4
enable_pin: !PG0
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: PE4            # unconnected
sensor_type: dummy20
sensor_pin: PF0            # = A0 on Seeeduino Mega; floating -> always ~20 C
min_temp: 0
max_temp: 300
min_extrude_temp: 0        # allow E-moves at "20 C" during fake printing
max_extrude_cross_section: 50
max_extrude_only_distance: 500
control: pid
pid_kp: 29.800
pid_ki: 1.774
pid_kd: 125.159

# Heater target is never set (M104/M109 are no-ops below), but relax the
# watchdog anyway so a stray SET_HEATER_TEMPERATURE can't shut us down.
[verify_heater extruder]
max_error: 999999
check_gain_time: 9999
hysteresis: 999
heating_gain: 0.01

[fan]
pin: PH4                   # unconnected

# ------------------------------------------------------------------
# Real actuators
# ------------------------------------------------------------------

# WS2812B strip. NOTE: bit-banged on a 16 MHz AVR the timing is tight —
# keep the chain short and test; if it glitches, drive the strip from
# the Pi instead. Data line is 5 V on the Mega — level matches the strip.
[neopixel case_light]
pin: PB5                   # Arduino D11
chain_count: 10
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

# Door servo, standard 50 Hz PPM (1..2 ms pulse).
[servo door_servo]
pin: PH3                   # Arduino D6
maximum_servo_angle: 180
minimum_pulse_width: 0.000544
maximum_pulse_width: 0.0024
initial_angle: 0           # door closed on boot

# ------------------------------------------------------------------
# Moonraker / KlipperScreen essentials
# ------------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[respond]

[force_move]
enable_force_move: True

# ------------------------------------------------------------------
# Fake-printer overrides
# ------------------------------------------------------------------

# Endstops are floating -> real homing would hang or error out.
# Pretend homing succeeded instantly.
[gcode_macro G28]
rename_existing: G28.0
gcode:
    SET_KINEMATIC_POSITION X=0 Y=0 Z=0

# Sliced gcode sets/waits for temperatures; at a constant 20 C an
# M109/M190 wait would never return. Swallow all heater commands.
[gcode_macro M104]
rename_existing: M104.0
gcode:

[gcode_macro M109]
rename_existing: M109.0
gcode:

[gcode_macro M140]
gcode:

[gcode_macro M190]
gcode:

# ------------------------------------------------------------------
# Custom commands
# ------------------------------------------------------------------
[gcode_macro DOOR_OPEN]
gcode:
    SET_SERVO SERVO=door_servo ANGLE=90
    G4 P800
    SET_SERVO SERVO=door_servo WIDTH=0   # stop pulses: no hold jitter

[gcode_macro DOOR_CLOSE]
gcode:
    SET_SERVO SERVO=door_servo ANGLE=0
    G4 P800
    SET_SERVO SERVO=door_servo WIDTH=0

[gcode_macro LIGHTS_ON]
gcode:
    SET_LED LED=case_light RED=1.0 GREEN=1.0 BLUE=1.0 SYNC=0

[gcode_macro LIGHTS_OFF]
gcode:
    SET_LED LED=case_light RED=0 GREEN=0 BLUE=0 SYNC=0

# Status colors for the kiosk flow
[gcode_macro STATUS_READY]
gcode:
    SET_LED LED=case_light RED=0 GREEN=0.5 BLUE=0 SYNC=0

[gcode_macro STATUS_AWAITING_PAYMENT]
gcode:
    SET_LED LED=case_light RED=0.8 GREEN=0.5 BLUE=0 SYNC=0

[gcode_macro STATUS_PRINTING]
gcode:
    SET_LED LED=case_light RED=0 GREEN=0 BLUE=0.8 SYNC=0

[gcode_macro STATUS_ERROR]
gcode:
    SET_LED LED=case_light RED=1.0 GREEN=0 BLUE=0 SYNC=0
