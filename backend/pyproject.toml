[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "marketplace-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # file upload
    "aiofiles>=24.1",             # StaticFiles
    "httpx2>=0.28",               # HTTP client for printer calls + TestClient
    "openai>=1.40",               # LLM offer selection
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
serve = "src.main:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
